  <div class="page">

    <div class="contato-layout">

      <!-- ── INFO ──────────────────────────────────────────── -->
      <div class="contato-info">

        <h1 class="page-title reveal">con<em>tato</em></h1>

        <div class="contact-item reveal reveal-delay-1">
          <p class="contact-label">e-mail</p>
          <!-- Replace with your actual email -->
          <a href="mailto:luyzatalexandre@email.com" class="contact-value">
            luyzatalexandre@email.com
          </a>
        </div>

        <div class="contact-item reveal reveal-delay-2">
          <p class="contact-label">localização</p>
          <p class="contact-value">Brasil</p>
        </div>


      </div>

      <!-- ── FORM ───────────────────────────────────────────── -->
      <div class="contact-form reveal reveal-delay-1">
        <!--
          Para receber mensagens do formulário, conecte-o a um serviço como:
          - Formspree (formspree.io) — basta trocar o action abaixo
          - Netlify Forms — adicione data-netlify="true" no <form>
          - EmailJS — configure via JavaScript
        -->
        <form action="#" method="POST" novalidate>

          <div class="form-group">
            <label class="form-label" for="name">nome</label>
            <input
              class="form-input"
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="email">e-mail</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="assunto">assunto</label>
            <input
              class="form-input"
              type="text"
              id="assunto"
              name="assunto"
              placeholder="Colaboração, exposição, pergunta..."
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="mensagem">mensagem</label>
            <textarea
              class="form-textarea"
              id="mensagem"
              name="mensagem"
              placeholder="Escreva aqui..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-submit">
            enviar
          </button>

        </form>
      </div>

    </div>
